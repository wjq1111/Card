syntax = "proto3";

package poker;

service PokerService {
  rpc Play(stream ClientEvent) returns (stream ServerEvent);
}

message ClientEvent {
  string player_id = 1;
  string request_id = 8;
  string reconnect_token = 9;

  oneof payload {
    JoinRoom join_room = 2;
    SitDown sit_down = 3;
    StandUp stand_up = 4;
    SetReady set_ready = 5;
    StartHand start_hand = 6;
    PlayerMove player_move = 7;
    Heartbeat heartbeat = 10;
    Reconnect reconnect = 11;
    ChatMessage chat_message = 12;
  }
}

message JoinRoom {
  string room_id = 1;
  string name = 2;
}

message SitDown {
  int32 seat_index = 1;
}

message StandUp {}

message SetReady {
  bool ready = 1;
}

message StartHand {}

message PlayerMove {
  MoveType type = 1;
  int32 amount = 2;
}

message Heartbeat {}

message Reconnect {
  string player_id = 1;
  string reconnect_token = 2;
  string room_id = 3;
}

message ChatMessage {
  string text = 1;
}

message ServerEvent {
  string event_id = 10;
  string request_id = 11;

  oneof payload {
    Joined joined = 1;
    RoomSnapshot snapshot = 2;
    Error error = 3;
    PrivatePlayerState private_state = 4;
    HandResult hand_result = 5;
    ServerNotice server_notice = 6;
    ChatMessage chat_message = 7;
  }
}

message Joined {
  string player_id = 1;
  string room_id = 2;
  string reconnect_token = 3;
}

message Error {
  string code = 1;
  string message = 2;
}

message RoomSnapshot {
  string room_id = 1;
  string hero_player_id = 2;
  GamePhase phase = 3;
  repeated Seat seats = 4;
  repeated Card board = 5;
  int32 pot = 6;
  int32 current_bet = 7;
  int32 min_raise = 8;
  int32 dealer_seat = 9;
  int32 active_seat = 10;
  int32 hand_number = 11;
  repeated Card hero_cards = 12;
  repeated string log = 13;
  HandResult last_hand_result = 14;
  string current_hand_id = 15;
  int32 auto_start_countdown_seconds = 16;
}

message Seat {
  int32 seat_index = 1;
  string player_id = 2;
  string name = 3;
  int32 chips = 4;
  int32 committed = 5;
  bool folded = 6;
  bool all_in = 7;
  bool ready = 8;
  bool is_dealer = 9;
  bool is_turn = 10;
  int32 hole_card_count = 11;
  int32 hand_committed = 12;
  bool acted_this_round = 13;
  bool is_offline = 14;
}

message PrivatePlayerState {
  string player_id = 1;
  repeated Card hole_cards = 2;
  int32 seat_index = 3;
}

message PotAward {
  int32 amount = 1;
  repeated int32 winner_seats = 2;
  repeated int32 eligible_seats = 3;
}

message ShownHand {
  int32 seat_index = 1;
  repeated Card cards = 2;
  string hand_name = 3;
}

message ChipDelta {
  int32 seat_index = 1;
  int32 delta = 2;
  int32 final_stack = 3;
}

message HandResult {
  string hand_id = 7;
  int32 hand_number = 1;
  repeated Card board = 2;
  repeated PotAward pot_awards = 3;
  repeated int32 winner_seats = 4;
  repeated ShownHand shown_hands = 5;
  repeated ChipDelta chip_deltas = 6;
}

message ServerNotice {
  string message = 1;
}

message Card {
  Suit suit = 1;
  Rank rank = 2;
}

enum Suit {
  SUIT_UNSPECIFIED = 0;
  CLUBS = 1;
  DIAMONDS = 2;
  HEARTS = 3;
  SPADES = 4;
}

enum Rank {
  RANK_UNSPECIFIED = 0;
  TWO = 2;
  THREE = 3;
  FOUR = 4;
  FIVE = 5;
  SIX = 6;
  SEVEN = 7;
  EIGHT = 8;
  NINE = 9;
  TEN = 10;
  JACK = 11;
  QUEEN = 12;
  KING = 13;
  ACE = 14;
}

enum GamePhase {
  GAME_PHASE_UNSPECIFIED = 0;
  WAITING = 1;
  PREFLOP = 2;
  FLOP = 3;
  TURN = 4;
  RIVER = 5;
  SHOWDOWN = 6;
  HAND_COMPLETE = 7;
}

enum MoveType {
  MOVE_TYPE_UNSPECIFIED = 0;
  FOLD = 1;
  CHECK = 2;
  CALL = 3;
  RAISE = 4;
  ALL_IN = 5;
}
